# Lone OS — Production (app only, Supabase runs separately)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://painel.lonemidia.com/supabase
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID}
        NEXT_PUBLIC_PORTAL_DOMAIN: https://resultados.lonemidia.com
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
        SENTRY_ORG: ${SENTRY_ORG}
        SENTRY_PROJECT: lone-os-portal
    restart: always
    ports:
      # Só o nginx do próprio servidor acessa (127.0.0.1). Publicado em 0.0.0.0, o Docker passava por cima
      # do ufw e o painel respondia direto em http://IP:3000, sem Cloudflare nem HTTPS (achado 25/09).
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://painel.lonemidia.com/supabase
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_INTERNAL_URL: http://supabase-kong-1:8000
      NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      # AES-256 key pra vault de senhas de cliente (base64 32 bytes).
      # Gere uma e guarde BACKUP — perder essa chave = perder acesso às senhas armazenadas.
      VAULT_KEY: ${VAULT_KEY}
      CRON_SECRET: ${CRON_SECRET}
      # Fila (Fase 0B): pg-boss + relay do outbox rodam dentro do servidor quando WORKER_ENABLED=true.
      # DATABASE_URL = conexão direta ao supabase-db-1 (rede supabase_default). Vazio = fila desligada.
      DATABASE_URL: ${DATABASE_URL:-}
      WORKER_ENABLED: ${WORKER_ENABLED:-}
      # Evolution API (WhatsApp) — alertas de saldo p/ grupo do gestor de tráfego
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      # Número dedicado do agente (monitor[IA]) — o Agente CS posta as sugestões por aqui.
      EVOLUTION_API_KEY_NEW: ${EVOLUTION_API_KEY_NEW}
      EVOLUTION_INSTANCE_NEW: ${EVOLUTION_INSTANCE_NEW}
      # Agente CS (inbound). Webhook valida CS_INBOUND_SECRET. Quem é da equipe vem de
      # team_members.whatsapp_phone (Gestão da Equipe) — o CS_LONE_TEAM_JIDS do .env foi aposentado
      # em 14/09/2026. CS_PILOT_GROUP_JIDS = allowlist do piloto (LGPD): vazio = todos.
      CS_INBOUND_SECRET: ${CS_INBOUND_SECRET}
      CS_PILOT_GROUP_JIDS: ${CS_PILOT_GROUP_JIDS}
      # Cliente alvo dos cards de TESTE quando o grupo do piloto não mapeia cliente real.
      CS_TEST_CLIENT_ID: ${CS_TEST_CLIENT_ID}
      # Grupo interno onde o agente posta as sugestões e recebe "ok/nao <código>".
      CS_INTERNAL_GROUP_JID: ${CS_INTERNAL_GROUP_JID}
      CS_CADASTRO_GROUP_JID: ${CS_CADASTRO_GROUP_JID}
      CS_OWNER_JID: ${CS_OWNER_JID}
      CS_VENDAS_GROUP_JID: ${CS_VENDAS_GROUP_JID:-}
      CS_TRAFFIC_GROUP_JID: ${CS_TRAFFIC_GROUP_JID}
      CS_TEAM_GROUP_JID: ${CS_TEAM_GROUP_JID}
      # Grupo administrativo (só o Roberto). Recebe o relatório do time e o resumo do CEO —
      # números que não vão pro grupo de todo mundo. Declarar aqui é obrigatório: este compose
      # lista variável por variável, então pôr no .env sem declarar não chega ao container.
      CS_ADM_GROUP_JID: ${CS_ADM_GROUP_JID}
      # Piloto SDR Lone (prospecção). Instância de saída separável do CS (hoje é a mesma, NEW).
      # Google = OAuth do Roberto (Calendar + Meet + Sheets); sem as chaves, reunião online sai sem link.
      PROSPECT_OUTBOUND_INSTANCE: ${PROSPECT_OUTBOUND_INSTANCE:-}
      PROSPECT_OUTBOUND_KEY: ${PROSPECT_OUTBOUND_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DRIVA_API_KEY: ${DRIVA_API_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://painel.lonemidia.com}
      # Aprovação de arte pelo CLIENTE no portal. Desligada por decisão do Roberto (31/08): o
      # cliente manda material pelo painel, mas o aceite final volta a ser conversa com o time.
      # "on" religa o botão. Pedir ajuste segue funcionando sem isto.
      PORTAL_APROVACAO_CLIENTE: ${PORTAL_APROVACAO_CLIENTE:-}
      # Comercial (out/2026): o formulário do site assina cada cadastro com este segredo (o mesmo valor
      # de LONEOS_LEAD_SECRET na Vercel do site). Vazio = recebimento desligado (a rota responde 503).
      LONEOS_SITE_LEAD_SECRET: ${LONEOS_SITE_LEAD_SECRET:-}
      # Leitura assinada da situação dos clientes pelo financeiro privado (out/2026; só situação, nunca valor).
      # O mesmo valor fica no financeiro como LF_LONE_OS_READ_SECRET. Vazio = porta fechada (503).
      LONEOS_FINANCE_READ_SECRET: ${LONEOS_FINANCE_READ_SECRET:-}
      # D4Sign (26/10/2026): quem assinou e quem falta, avisado no grupo de cadastro (lib/contracts/d4sign.ts).
      # As chaves entram pelo painel (Configurações › Jurídico, cifradas); estas são a reserva. Vazio = vale o painel.
      D4SIGN_API_TOKEN: ${D4SIGN_API_TOKEN:-}
      D4SIGN_CRYPT_KEY: ${D4SIGN_CRYPT_KEY:-}
      D4SIGN_HMAC_SECRET: ${D4SIGN_HMAC_SECRET:-}
      D4SIGN_SAFE_UUID: ${D4SIGN_SAFE_UUID:-}
      D4SIGN_API_URL: ${D4SIGN_API_URL:-}
      # Limite de chamadas por hora da conta (padrão 10) e os e-mails com que os sócios assinam na D4Sign.
      D4SIGN_LIMITE_HORA: ${D4SIGN_LIMITE_HORA:-}
      D4SIGN_EMAILS_LONE: ${D4SIGN_EMAILS_LONE:-}
      # E-mails PESSOAIS da equipe que o filtro de lixo trata como "teste da equipe" (não moram no código).
      CRM_EMAILS_EQUIPE: ${CRM_EMAILS_EQUIPE:-}
      # Grupos SANDBOX de teste: ali o agente trata msg da equipe como pedido e classifica mesmo
      # sendo o grupo interno (pra testar o fluxo completo). Vazio em prod real.
      CS_TEST_GROUP_JIDS: ${CS_TEST_GROUP_JIDS}
      # browserless (headless chrome) p/ renderizar o PDF do relatório semanal
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN}
      BROWSERLESS_URL: http://chromium:3000
      SENTRY_DSN: ${SENTRY_DSN}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
      SENTRY_ORG: ${SENTRY_ORG}
      NEXT_PUBLIC_PORTAL_DOMAIN: https://resultados.lonemidia.com
    networks:
      - default
      - supabase_default

  # Headless chrome isolado — renderiza o PDF do relatório semanal.
  # Sem porta pública; o app alcança via http://chromium:3000 na rede interna.
  chromium:
    image: ghcr.io/browserless/chromium:latest
    restart: always
    environment:
      TOKEN: ${BROWSERLESS_TOKEN}
      CONCURRENT: "1"
      TIMEOUT: "60000"
    mem_limit: 1500m
    networks:
      - default

networks:
  default:
  supabase_default:
    external: true
